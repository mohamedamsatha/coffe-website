
name: Cafe Aurelia CI-CD

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKETHUB_NAME }}/aurelia:latest .

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKETHUB_NAME }}
          password: ${{ secrets.DOCKETHUB_TOKEN }}

      # 4. Push image to Docker Hub
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKETHUB_NAME }}/aurelia:latest

      # 5. Check GitHub repository context
      - name: Check GitHub OIDC Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      # 6. Debug OIDC Token Claims
      - name: Debug OIDC Token Claims
        run: |
          OIDC_TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          OIDC_TOKEN="$OIDC_TOKEN" python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("Issuer:", claims.get("iss"))
          print("Audience:", claims.get("aud"))
          print("Subject:", claims.get("sub"))
          PY

      # 7. Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 8. Deploy to EC2 through SSM
      - name: Deploy to EC2
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["sudo docker pull mohamedamsatha2/aurelia:latest","sudo docker rm -f aurelia-web || true","sudo docker run -d --name aurelia-web -p 80:80 mohamedamsatha2/aurelia:latest"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out!"
          exit 1
